name: maven.yml
on:
  workflow_call:
    inputs:
      maven-args:
        description: "Additional Maven arguments to pass"
        required: false
        type: string
      build-artifact-name:
        description: "Name of the build artifact to download"
        required: true
        type: string
      build-artifact-path:
        description: "Path of the build artifact to download"
        required: true
        type: string

permissions:
  contents: read

jobs:
  maven:
    name: Maven Build & Test
    permissions:
      contents: write    
      security-events: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate keys for JWT and encryption tests
        run: |
          mkdir keys
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out keys/privateKey.pem && openssl ec -pubout -in keys/privateKey.pem -out keys/publicKey.pem
          openssl rand -base64 32 > keys/totp-encryption.key

      - name: Set up Maven Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Run Spotless Check
        run: ./mvnw -B spotless:check

      - name: Run License Check
        run: ./mvnw -B license:check-file-header

      - name: Build & Test Backend
        run: ./mvnw -B ${{ inputs.maven-args }} package

      - name: Update dependency graph
        if: github.repository == 'FelixHertweck/seatReservation' && github.event_name == 'push' && github.ref_name == 'main'
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.build-artifact-name }}
          path: ${{ inputs.build-artifact-path }}
          retention-days: 4

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-schema
          path: |
            target/openapi
        
      - name: Upload Jacoco report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-report
          path: |
            target/jacoco-report