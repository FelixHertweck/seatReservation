quarkus:
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    jdbc:
      url: jdbc:postgresql://db:5432/${POSTGRES_DB:seatReservation}

  redis:
    hosts: redis://redis:6379

  mailer:
    mock: false
    from: ${MAIL_FROM}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    tls: ${MAIL_TLS}
    start-tls: ${MAIL_START_TLS}

  hibernate-orm:
    schema-management:
      strategy: validate

  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: "pre-UUID schema (bigint/bigserial primary keys)"

jwt:
  cookie:
    secure: ${SSL_ENABLED:true}

# Mounted read-only from the host's keys/ directory (see docker-compose.yml), same as the JWT
# keys below. Keep it stable -- losing it makes every stored TOTP secret unrecoverable.
security:
  encryption-key-location: /deployments/keys/totp-encryption.key

email:
  frontend-base-url: ${APP_URL} # Change in case provide frontend on different URL
  bcc-address: ${EMAIL_BCC_ADDRESS:} # Optional BCC address for event notifications to users (leave empty to disable)

smallrye:
  jwt:
    new-token:
      issuer: ${APP_URL}
      signature-algorithm: ES256
    sign:
      key:
        location: /deployments/keys/privateKey.pem
mp:
  jwt:
    verify:
      publickey:
        location: /deployments/keys/publicKey.pem
        algorithm: ES256
