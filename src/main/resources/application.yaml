
registration:
  enabled: true

# 2FA challenge verification rate limiting configuration (POST /api/auth/2fa/verify).
# Tracked per user (not per challenge), so requesting a fresh challenge does not reset the budget.
two-factor:
  max-failed-attempts: 5
  lockout-duration-seconds: 300

# AES-256 key file for EncryptedStringConverter (e.g. TOTP secrets at rest). Same pattern as the
# JWT keys below: a file under keys/, generated locally, gitignored, and bind-mounted (read-only)
# into the container for docker deployments (see application-docker.yaml for the mount path).
security:
  encryption-key-location: keys/totp-encryption.key

# Redis-backed seat selection cart (soft-lock while a user has a seat selected
# but hasn't completed the reservation yet).
seatcart:
  ttl-seconds: 300
  # Extra time added on top of ttl-seconds for the seat-cart access grant's sliding TTL window,
  # so the grant outlives the seat holds it protects.
  access-grant-ttl-buffer-seconds: 30

smallrye:
  jwt:
    token:
      expiration:
        minutes: 3
    refreshtoken:
        expiration:
            days: 7
    always-check-authorization: true
    new-token:
      issuer: http://localhost:8080
    sign:
      key:
        location: keys/privateKey.pem
mp:
  jwt:
    token:
      header: Cookie
      cookie: jwt
    verify:
        publickey:
            location: keys/publicKey.pem

exporter:
    pdf:
        minutesBeforeEventStart: 10

email:  
  resend-cooldown-seconds: 60
  frontend-base-url: http://localhost:8080
  verification:
    expiration:
      minutes: 30

  seatmap:
    token:
      expiration:
        days: 30

  # Transactional email outbox / queue settings.
  # Mails are persisted first and delivered asynchronously by a background dispatcher,
  # which retries failed sends with exponential back-off before giving up (dead letter).
  queue:
    poll-interval: 30s # Fallback poll interval; immediate-trigger normally beats this
    immediate-trigger: true # Drain right after a mail is committed instead of waiting for the poll
    batch-size: 20 # Max number of mails handled per drain cycle
    max-attempts: 5 # Delivery attempts before a mail becomes a FAILED dead letter
    retry-backoff-seconds: 60 # Base back-off; doubles per attempt (60s, 120s, 240s, ...)
    max-backoff-seconds: 3600 # Upper bound for the back-off delay
    sending-timeout-seconds: 300 # After this, a mail stuck in SENDING is requeued
    retention-days: 30 # How long delivered/failed mails are kept before cleanup

  # Optional BCC address for event notifications to users (leave empty to disable)
  bcc-address: ""
 
  # Template for entrance information text
  entrance-info-template: "Please use entrance {entrance} for seats {seats}"

  # Optional external directory holding email template overrides (leave empty to use the
  # bundled templates). Files there mirror the bundled layout, e.g.
  # <dir>/email/reservation-confirmation.html, and are picked up on application start.
  template:
    override-dir: ""

  header:
    confirmation: "Please Confirm Your Email Address"
    password-changed: "Your Password Has Been Changed"
    reservation-confirmation: "Your Reservation Confirmation"
    reservation-update: "Your Reservation Update"
    event-rescheduled: "Important: Your Event Schedule Has Changed"
    reminder: "Reminder: Your event is starting soon!"
    reservation-overview: "Reservation overview for your event:"

wallet:
  google:
    enabled: "${GOOGLE_WALLET_ENABLED:false}"
    default-language: "${GOOGLE_WALLET_DEFAULT_LANGUAGE:en-US}"
    issuer-id: "${GOOGLE_WALLET_ISSUER_ID:3388000000001234567}"
    service-account-email: "${GOOGLE_WALLET_SA_EMAIL:wallet-sa@project.iam.gserviceaccount.com}"
    service-account-key-path: "keys/google-wallet-sa.pem"
    # Comma-separated list of allowed origins for the "Save to Google Wallet" web button
    allowed-origins: "${GOOGLE_WALLET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}"
    # Optional: publicly accessible HTTPS URL to the logo shown on the pass
    logo-uri: "${GOOGLE_WALLET_LOGO_URI:https://raw.githubusercontent.com/FelixHertweck/seatReservation/master/webapp/public/logo.png}"
    # Review status of the pass class: UNDER_REVIEW (default for demo/test mode) or APPROVED (for approved production accounts)
    review-status: "${GOOGLE_WALLET_REVIEW_STATUS:UNDER_REVIEW}"
