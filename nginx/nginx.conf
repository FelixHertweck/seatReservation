events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # This is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # rate limiting zones:
    # general API traffic
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # brute-force-sensitive auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # Proxy for backend
        # Stricter limit for auth endpoints
        location ~ ^/api/auth/(login|register|password-reset(/confirm)?|username-recovery|webauthn/(login|register|register-new))$ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # rest of backend api requests
        location ~ ^/(api|q)/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy for grafana
        location /grafana/ {
            rewrite  ^/grafana/(.*)  /$1 break;
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Grafana Live WebSocket connections.
        location /grafana/api/live/ {
            rewrite  ^/grafana/(.*)  /$1 break;
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Proxy legal notice
        #location ~ ^/.*/legal-notice$ {
        #    return 301 http://target-legal-notice;
        #}

        # Proxy for privacy policy
        #location ~ ^/.*/privacy$ {
        #    return 301 http://target-privacy;
        #}

        # Proxy for frontend (Next.js)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}